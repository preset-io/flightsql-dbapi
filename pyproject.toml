[build-system]
requires = ["hatchling<=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "flightsql-dbapi"
version = "0.2.3+preset.2"
authors = [
  { name="Brett Buddin", email="brett@buddin.org" },
]
maintainers = [
  { name="Preset" },
]
description = "DB API 2 and SQLAlchemy adapter for Flight SQL"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "sqlalchemy>=1.4.6,<3.0",
    "pyarrow>=16.0.0",
    "protobuf>=4.21.12",
    "packaging>=21.3"
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov"
]
lint = [
    "black",
    "flake8",
    "isort>5.10.0",
    "mypy>1.5.0",
    "pyproject-flake8",
    "toml-cli",
    "types-protobuf",
]
dev = [
    "build",
    "pdoc",
    "flightsql-dbapi[test,lint]"
]

[project.urls]
"Homepage" = "https://github.com/preset-io/flightsql-dbapi"
"Upstream" = "https://github.com/influxdata/flightsql-dbapi"

[project.entry-points."sqlalchemy.dialects"]
datafusion = "flightsql.sqlalchemy:DataFusionDialect"
"datafusion.flightsql" = "flightsql.sqlalchemy:DataFusionDialect"

[tool.hatch.build.targets.wheel.force-include]
"flightsql/flightsql_pb2.pyi" = "flightsql/flightsql_pb2.pyi"

[tool.black]
line-length = 120
extend-exclude = "(.*_pb2.py|.*_pb2.pyi)"

[tool.isort]
profile = "black"
extend_skip_glob = ["*_pb2.py", "*_pb2.pyi"]

[tool.pyright]
exclude = [
    "**/__pycache__",
    ".git",
    "venv",
    "build",
    "flightsql/*_pb2.py",
    "flightsql/*_pb2.pyi",
]

[tool.flake8]
statistics = true
max-line-length = 140
max-complexity = 15
extend-ignore = ["E203"]
exclude = """
    .git
    __pycache__
    flightsql/*_pb2.py
    build
    dist
    venv
    test.py
"""
